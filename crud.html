<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portfolio Management | Lukman Hakim</title>

    <!-- Favicon -->
    <link rel="icon" href="img/favicon-32x32.png" type="image/png" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <header>
      <nav class="navbar">
        <div class="logo">
          <h2>
            <i class="fa-solid fa-user"></i>
            MyProfile
          </h2>
        </div>

        <ul class="menu">
          <li>
            <a href="index.html">
              <i class="fa-solid fa-house"></i>
              Home
            </a>
          </li>

          <li>
            <a class="active" href="crud.html">
              <i class="fa-solid fa-table"></i>
              CRUD
            </a>
          </li>

          <li>
            <button id="themeToggle">
              <i class="fa-solid fa-moon"></i>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- ================= CRUD ================= -->

    <section class="crud-container">
      <h1>
        <i class="fa-solid fa-folder-open"></i>
        Portfolio Management
      </h1>

      <!-- Toolbar -->

      <div class="crud-toolbar">
        <button id="openModal" class="primary-btn">
          <i class="fa-solid fa-plus"></i>
          Tambah Project
        </button>

        <div class="action-buttons">
          <button id="exportPDF" class="pdf-btn">
            <i class="fa-solid fa-file-pdf"></i>
            Export PDF
          </button>

          <button id="exportExcel" class="excel-btn">
            <i class="fa-solid fa-file-excel"></i>
            Export Excel
          </button>
        </div>
      </div>

      <!-- Search -->

      <input type="search" id="search" placeholder="Cari nama, kategori, atau status..." />

      <!-- Table -->

      <table>
        <thead>
          <tr>
            <th>No</th>

            <th>Nama Project</th>

            <th>Kategori</th>

            <th>Tahun</th>

            <th>Status</th>

            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>
      </table>

      <!-- Pagination -->

      <div class="pagination" id="pagination"></div>
    </section>

    <!-- ================= MODAL ================= -->

    <div id="projectModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>
            <i class="fa-solid fa-folder-plus"></i>

            Project
          </h2>

          <button id="closeModal">&times;</button>
        </div>

        <form id="projectForm">
          <input type="text" id="nama" placeholder="Nama Project" required />

          <select id="kategori">
            <option>Website</option>

            <option>Mobile</option>

            <option>Desktop</option>

            <option>UI/UX</option>
          </select>

          <input type="number" id="tahun" placeholder="Tahun" required />

          <select id="status">
            <option>Selesai</option>

            <option>Proses</option>

            <option>Pending</option>
          </select>

          <button type="submit">
            <i class="fa-solid fa-floppy-disk"></i>

            Simpan Project
          </button>
        </form>
      </div>
    </div>

    <!-- ================= FOOTER ================= -->

    <footer>
      <p>© 2026 Lukman Hakim | Portfolio Management</p>
    </footer>

    <!-- ================= LIBRARY ================= -->

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <!-- jsPDF AutoTable -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable"></script>

    <!-- ================= JAVASCRIPT ================= -->

    <script defer src="js/storage.js"></script>

    <script defer src="js/theme.js"></script>

    <script defer src="js/notification.js"></script>

    <script defer src="js/export.js"></script>

    <script defer src="js/modal.js"></script>

    <script defer src="js/crud.js"></script>

    <script defer src="js/app.js"></script>
  </body>
</html>
